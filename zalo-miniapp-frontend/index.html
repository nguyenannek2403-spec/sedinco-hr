<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />

    <meta name="theme-color" content="#f8fafc" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="msapplication-tap-highlight" content="no" />
    <title>Sedinco HR - Hệ Thống Chấm Công & Quản Trị Nhân Sự</title>
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('sedinco_theme_mode');
          var mode = saved === 'dark' ? 'dark' : 'light';
          var root = document.documentElement;
          root.classList.toggle('dark', mode === 'dark');
          root.setAttribute('zaui-theme', mode);
          root.style.colorScheme = mode;
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', mode === 'dark' ? '#090d16' : '#f8fafc');
          var rawScale = Number(localStorage.getItem('sedinco_font_scale') || 100);
          var validScales = [100, 110, 125, 150, 175, 200];
          var scale = validScales.indexOf(rawScale) >= 0 ? rawScale : 100;
          root.setAttribute('data-font-scale', String(scale));
          if (scale !== 100) {
            root.style.fontSize = (16 * scale) / 100 + 'px';
          }
        } catch (e) {}
      })();
    </script>
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Roboto+Mono:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="app"></div>
    <!-- built script files will be auto injected -->
    <script type="module" src="/src/app.js"></script>
  </body>
</html>
